name: Python CI CD Demo

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Ruff - Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

  test:
    name: Pytest - Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  deploy:
    name: CD - Deployment Demo
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Simulate deployment
        run: |
          echo "All CI checks passed."
          echo "Deploying application (demo simulation)..."
          echo "Deployment completed."
