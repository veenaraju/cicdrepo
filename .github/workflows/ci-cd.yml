
name: Python CI CD Demo

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # --------------------------------
  # JOB 1: CONTINUOUS INTEGRATION
  # CODE QUALITY
  # --------------------------------

  lint:
    name: Ruff - Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check .


  # --------------------------------
  # JOB 2: UNIT TESTING
  # --------------------------------

  test:
    name: Pytest - Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -v


  # --------------------------------
  # JOB 3: CONTINUOUS DEPLOYMENT
  # SELF-HOSTED WINDOWS RUNNER
  # --------------------------------

  deploy:
    name: CD - Self Hosted Deployment

    runs-on: [self-hosted, windows, x64]

    # CD depends on both CI jobs
    needs: [lint, test]

    # Deploy only when both CI jobs succeed
    # and the event is a push to main
    if: >-
      success() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    # PowerShell execution configuration
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"

    steps:

      # ----------------------------
      # CHECKOUT
      # ----------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ----------------------------
      # VERIFY RUNNER
      # ----------------------------

      - name: Verify self-hosted runner
        run: |
          Write-Host "Running on self-hosted Windows machine"
          Write-Host "Deployment started"

          Write-Host "Computer Name:"
          $env:COMPUTERNAME

          Write-Host "Current User:"
          whoami


      # ----------------------------
      # CREATE DEPLOYMENT DIRECTORY
      # ----------------------------

      - name: Create deployment folder
        run: |
          $DeployPath = "C:\users\veens\Deployment\cicd-demo"

          New-Item -ItemType Directory -Force -Path $DeployPath

          Write-Host "Deployment folder created"


      # ----------------------------
      # DEPLOY APPLICATION FILES
      # ----------------------------

      - name: Deploy application files
        run: |
          $DeployPath = "C:\users\veens\Deployment\cicd-demo"
          $SourcePath = $env:GITHUB_WORKSPACE

          Write-Host "Source: $SourcePath"
          Write-Host "Destination: $DeployPath"

          robocopy $SourcePath $DeployPath /E /XD .git .venv .github
          $RobocopyExitCode = $LASTEXITCODE

          if ($RobocopyExitCode -ge 8) {
              throw "File deployment failed.  Robocopy exit code: $RobocopyExitCode"
          }

          Write-Host "Robocopy exit code: $RobocopyExitCode"
          Write-Host "Application files deployed successfully"

          # Reset native command exit code
          $global:LASTEXITCODE = 0
      # ----------------------------
      # DEPLOYMENT COMPLETED
      # ----------------------------

      - name: Deployment completed
        run: |
          Write-Host "CI checks passed"
          Write-Host "Deployment completed successfully"

          Get-ChildItem "C:\users\veens\Deployment\cicd-demo"
