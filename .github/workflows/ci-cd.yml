
name: Python CI CD Demo

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # --------------------------------
  # JOB 1: CONTINUOUS INTEGRATION
  # --------------------------------

  lint:
    name: Ruff - Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff
        run: ruff check .

  # --------------------------------
  # JOB 2: UNIT TESTING
  # --------------------------------

  test:
    name: Pytest - Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # --------------------------------
  # JOB 3: CONTINUOUS DEPLOYMENT
  # --------------------------------

  deploy:
    name: CD - Self Hosted Deployment

    runs-on: [self-hosted, windows, x64]

    needs: [lint, test]

    # Deploy only after a push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify self-hosted runner
        shell: powershell
        run: |
          Write-Host "Running on self-hosted Windows machine"
          Write-Host "Deployment started"

          $env:COMPUTERNAME

      - name: Create deployment folder
        shell: powershell
        run: |
          $DeployPath = "C:\users\veens\Deployment\cicd-demo"

          New-Item -ItemType Directory -Force -Path $DeployPath

      - name: Deploy application files
        shell: powershell
        run: |
          $DeployPath = "C:\users\veens\Deployment\cicd-demo"
          $SourcePath = $env:GITHUB_WORKSPACE

          robocopy $SourcePath $DeployPath /E /XD .git .venv

          if ($LASTEXITCODE -ge 8) {
              throw "File deployment failed"
          }

          Write-Host "Application files deployed successfully"

      - name: Deployment completed
        shell: powershell
        run: |
          Write-Host "CI checks passed"
          Write-Host "Deployment completed successfully"
          Get-ChildItem "C:\users\veens\Deployment\cicd-demo"
